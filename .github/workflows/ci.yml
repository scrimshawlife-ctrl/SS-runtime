name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  swift:
    runs-on: macos-15
    # Build with the Swift 6.2+ generation developers use. The runner default
    # (Xcode 16.4, Swift 6.1) needs over 5x the debug stack for a simulation
    # tick and overflowed Swift Testing's 512 KB worker threads (SIGBUS) on
    # SS-runtime #104; the same code needs ~96 KB under Swift 6.3.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned specification
        run: grep -q "0ed9ff96e6cc2293c73ccfbdcab419d9bd459389" SPEC_BASELINE.md
      - name: Test deterministic core
        run: swift test --skip CameraPlacementTests --skip CameraFairnessTests --parallel --num-workers 1
      - name: Test camera placement
        run: swift test --filter CameraPlacementTests --parallel --num-workers 1
      - name: Test camera fairness
        run: swift test --filter CameraFairnessTests --parallel --num-workers 1

  spec-parity:
    # D-061: from the adoption commit the runtime bundle must byte-match
    # SS-specs contracts/ and fixtures/. This job checks out the spec at the
    # pinned commit and byte-compares every bundled file, plus enforces that
    # all identity sources agree on the pin. The one documented exception is
    # the asset catalog's specificationCommit field (D-065), which the script
    # asserts is the ONLY difference. A guard nobody has seen fail is not yet
    # a guard: the negative proof (one-byte edit -> failure) is in the PR that
    # introduced this job.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned specification
        run: grep -q "0ed9ff96e6cc2293c73ccfbdcab419d9bd459389" SPEC_BASELINE.md
      - name: Byte-compare bundled contracts and fixtures against the pinned SS-specs
        run: bash scripts/spec_parity.sh

  app:
    # The iOS app target had never been compiled by CI: Bundle.module was
    # unavailable to a framework target and App/ had access-level errors.
    # Build it on every change so the README bootstrap path stays honest.
    #
    # It now runs SSRuntimeTests too. App/ is built by XcodeGen and is never
    # compiled by `swift test`, so touch routing, input, and HUD interaction had
    # no automated coverage — the shared root cause of the upgrade-gate restart
    # (#65) and the never-called TouchController.reset() (#66).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test SSRuntime for iOS Simulator
        run: |
          set -euo pipefail
          sim="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); ds=[x for v in d["devices"].values() for x in v if "iPhone" in x["name"]]; print(ds[-1]["udid"])')"
          # `| grep ... || true` cannot guard this build: under `pipefail` a
          # failed xcodebuild makes the pipeline non-zero, `|| true` fires, and
          # running `true` resets PIPESTATUS to [0] — so the guard below always
          # read 0 and the job could never fail. Keep xcodebuild's own status.
          set +e
          xcodebuild -project SSRuntime.xcodeproj -scheme SSRuntime -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$sim" CODE_SIGNING_ALLOWED=NO test \
            > /tmp/xcodebuild.log 2>&1
          status=$?
          set -e
          grep -E "error:|warning:|✘|Test run with|BUILD (SUCCEEDED|FAILED)|TEST (SUCCEEDED|FAILED)" /tmp/xcodebuild.log || true
          exit "$status"
